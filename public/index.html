<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OneMail</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%234f46e5'/><rect x='5' y='7' width='14' height='10' rx='2' fill='none' stroke='white' stroke-width='1.8'/><path d='M5.5 8.5 12 13l6.5-4.5' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<meta name="theme-color" content="#4f46e5">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm" class="card">
    <div class="card-brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7.5 12 13l8-5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><span>OneMail</span></div>
    <h1>登录 OneMail</h1>
    <p class="muted sub">用你的邮箱地址和密码登录</p>
    <label>邮箱地址<input name="address" type="email" autocomplete="username" required></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">登录</button>
    <p class="error" id="loginErr"></p>
  </form>
</div>

<div id="setup" class="login hidden">
  <form id="setupForm" class="card">
    <div class="card-brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7.5 12 13l8-5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><span>OneMail</span></div>
    <h1>首次设置</h1>
    <p class="muted sub">创建管理员邮箱。设置完成后这个页面就关闭了,只有你能登录。</p>
    <label>你的域名<input name="domain" placeholder="example.com" autocomplete="off" autocapitalize="off" required></label>
    <label>管理员用户名<div class="inline"><input name="user" value="admin" autocomplete="off" autocapitalize="off" required style="flex:1"><span class="muted" id="setupAt">@域名</span></div></label>
    <label>密码(至少 10 位)<input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
    <label>再输一次密码<input name="password2" type="password" autocomplete="new-password" minlength="10" required></label>
    <button class="primary" type="submit">完成设置</button>
    <p class="error" id="setupErr"></p>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7.5 12 13l8-5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><span>OneMail</span></div>
    <button class="primary compose-btn" id="composeBtn"><i data-i="pen"></i>写信</button>
    <select id="boxSel" class="hidden" title="查看哪个邮箱"></select>
    <nav id="folders">
      <a data-f="inbox"><i data-i="inbox"></i><span>收件箱</span><b data-c="inbox"></b></a>
      <a data-f="starred"><i data-i="star"></i><span>星标</span></a>
      <a data-f="sent"><i data-i="send"></i><span>已发送</span></a>
      <a data-f="trash"><i data-i="trash"></i><span>垃圾箱</span></a>
    </nav>
    <div class="side-foot">
      <a id="adminLink" class="hidden"><i data-i="users"></i><span>邮箱账号管理</span></a>
      <a id="settingsLink"><i data-i="gear"></i><span>设置</span></a>
      <div class="me">
        <span class="avatar" id="meAvatar"></span>
        <span class="me-text"><span id="meName"></span><span class="muted" id="meAddr"></span></span>
        <button class="icon-btn" id="logoutLink" title="退出登录" aria-label="退出登录"><i data-i="logout"></i></button>
      </div>
    </div>
  </aside>

  <section class="list">
    <div class="list-head">
      <button class="icon-btn mobile-only" id="menuBtn" aria-label="菜单"><i data-i="menu"></i></button>
      <div class="search"><i data-i="search"></i><input id="search" type="search" placeholder="搜索主题、发件人、内容"></div>
      <button class="icon-btn" id="refreshBtn" title="刷新" aria-label="刷新"><i data-i="refresh"></i></button>
    </div>
    <div class="list-sub">
      <strong id="folderTitle">收件箱</strong>
      <select id="rcptSel" class="rcpt-sel hidden" title="按收件地址筛选"></select>
    </div>
    <div id="items"></div>
    <button id="moreBtn" class="more hidden">加载更多</button>
  </section>

  <main class="reader" id="reader">
    <div class="empty"><i data-i="mailopen"></i><p>选一封信来看</p></div>
  </main>
</div>

<dialog id="composeDlg" class="compose">
  <form id="composeForm" method="dialog">
    <div class="dlg-head"><strong id="composeTitle">写信</strong><button type="button" class="icon-btn" data-close aria-label="关闭"><i data-i="x"></i></button></div>
    <label class="row hidden" id="fromRow">发件人<select name="from" id="fromSel"></select></label>
    <label class="row">收件人<input name="to" placeholder="多个地址用逗号分开" required></label>
    <label class="row">抄送<input name="cc"></label>
    <label class="row">密送<input name="bcc"></label>
    <label class="row">主题<input name="subject"></label>
    <textarea name="text" rows="14"></textarea>
    <input type="hidden" name="reply_to_id">
    <div class="dlg-foot">
      <label class="file-btn"><i data-i="clip"></i>添加附件<input type="file" name="files" multiple hidden></label>
      <span id="fileNames" class="muted"></span>
      <span class="spacer"></span>
      <span class="error" id="sendErr"></span>
      <button class="primary" type="submit" id="sendBtn"><i data-i="send"></i><span>发送</span></button>
    </div>
  </form>
</dialog>

<dialog id="settingsDlg">
  <div class="dlg-head"><strong>设置</strong><button type="button" class="icon-btn" data-close aria-label="关闭"><i data-i="x"></i></button></div>
  <form id="nameForm" class="stack">
    <label>显示名称(发信时对方看到的名字)<input name="dname"></label>
    <button type="submit">保存名称</button>
  </form>
  <hr>
  <form id="pwForm" class="stack">
    <label>原密码<input name="old" type="password" autocomplete="current-password" required></label>
    <label>新密码(至少 10 位)<input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
    <button type="submit">修改密码</button>
  </form>
  <p class="muted" id="settingsMsg"></p>
</dialog>

<dialog id="adminDlg" class="wide">
  <div class="dlg-head"><strong>邮箱账号管理</strong><button type="button" class="icon-btn" data-close aria-label="关闭"><i data-i="x"></i></button></div>
  <table class="users"><thead><tr><th>地址</th><th>名称</th><th>信件</th><th></th></tr></thead><tbody id="userRows"></tbody></table>
  <h3>新建邮箱</h3>
  <form id="newUserForm" class="grid">
    <input name="local" placeholder="用户名" required><span id="domainSuffix"></span>
    <input name="dname" placeholder="显示名称(可选)">
    <input name="password" type="password" placeholder="密码(至少 10 位)" minlength="10" autocomplete="new-password" required>
    <label class="inline"><input type="checkbox" name="is_admin"> 管理员</label>
    <button type="submit" class="primary">创建</button>
  </form>
  <p class="muted" id="adminMsg"></p>
  <h3>批量创建</h3>
  <form id="batchForm" class="stack">
    <textarea name="lines" rows="6" placeholder="每行一个账号,格式:用户名[,密码][,显示名称]&#10;不写密码会自动生成&#10;例如:&#10;alice&#10;bob,MyPassword123,Bob Li&#10;carol,,Carol"></textarea>
    <div class="dlg-foot">
      <span class="muted" id="batchMsg"></span><span class="spacer"></span>
      <button type="button" id="batchCsv" class="hidden">下载结果 CSV</button>
      <button type="submit" class="primary" id="batchBtn">批量创建</button>
    </div>
  </form>
  <table class="users hidden" id="batchTable"><thead><tr><th>地址</th><th>密码</th><th>结果</th></tr></thead><tbody></tbody></table>
  <h3>发信(Resend)</h3>
  <p class="muted" id="sendStatus"></p>
  <form id="resendForm" class="dlg-foot">
    <input name="key" type="password" placeholder="re_ 开头的 API Key" autocomplete="off" style="flex:1">
    <button type="submit" class="primary">保存</button>
    <button type="button" id="resendClear">清除</button>
  </form>
  <p class="muted">没有 Key?到 resend.com 免费注册,添加你的域名并验证,再在 API Keys 里创建一个。免费每天 100 封、每月 3000 封。</p>
</dialog>

<div id="toast" class="toast"></div>
<script src="/app.js"></script>
</body>
</html>
